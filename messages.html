<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>69069 · Ledger Messages</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .nav-links {
            text-align: center;
            margin: 6px 0;
        }

        .nav-links a {
            margin: 0 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
        }

        .nav-links .wallet {
            color: #facc15;
        }

        .nav-links .history {
            color: var(--brand-blue-soft);
        }

        .nav-links .offers {
            color: var(--brand-green-bright);
        }

        .nav-links .legacy {
            color: #a78bfa;
        }

        #history {
            font-size: 14px;
            max-height: 420px;
            overflow: auto;
        }

        #historyFooter {
            margin-top: 10px;
            font-size: 13px;
            color: #9ca3af;
        }

        #historyFooter a {
            color: var(--brand-blue-soft);
        }

        .event {
            border-bottom: 1px solid var(--input-bg);
            padding: 12px 0;
        }

        .event .dir-in {
            color: #22c55e;
            font-weight: bold;
        }

        .event .dir-out {
            color: #f97316;
            font-weight: bold;
        }

        .event .meta {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .event .meta .sender {
            color: #facc15;
        }

        .event .metadata-msg {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 4px;
            word-break: break-word;
            font-weight: 500;
        }

        .event a {
            font-size: 16px;
            font-weight: 700;
            color: var(--brand-blue-soft);
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .loading {
            color: var(--brand-blue-soft);
        }

        .error {
            color: #ef4444;
        }

        .event.new {
            border-left: 3px solid #22c55e;
            padding-left: 8px;
        }

        /* Keep long addresses / status text inside their cards */
        #address,
        #status {
            word-break: break-all;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        /* Blue border for lookup field - matching index.html */
        #lookupAddress {
            border: 1.5px solid #2d8cff;
            border-radius: 10px;
            padding: 12px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 12px rgba(45, 140, 255, 0.15);
            font-weight: 700;
            text-align: center;
        }

        #lookupAddress:focus {
            outline: none;
            box-shadow: 0 0 16px rgba(45, 140, 255, 0.35);
        }

        /* Transaction hash scan-start field */
        .tx-hash-group {
            position: relative;
            margin-top: 4px;
            margin-bottom: 15px;
        }

        #txHashInput {
            border: 1.5px solid #2d8cff;
            border-radius: 10px;
            padding: 12px 14px;
            background: #0f172a;
            color: white;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 12px rgba(45, 140, 255, 0.15);
            font-weight: 600;
            margin: 0;
            display: block;
        }

        #txHashInput:focus {
            outline: none;
            box-shadow: 0 0 16px rgba(45, 140, 255, 0.35);
        }

        #txHashHelper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            color: #9ca3af;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
            pointer-events: none;
            transition: opacity 0.12s ease;
        }

        #txHashHelper.hidden {
            opacity: 0;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header-row">
            <a href="index.html">
                <img src="logo.webp" alt="SOS69069" class="logo-badge">
            </a>
            <div>
                <h1>69069 Messages</h1>
                <p class="subtitle">Ethereum Mainnet</p>

        </div>

        <!-- NAV — same block & style as index.html -->
        <div class="card nav-links" style="margin-bottom:1px">
            <a href="index.html" class="wallet">Ledger</a>
            <a href="messages.html" class="history">MESSAGES</a>
            <a href="offers.html" class="offers">Presence</a>

        </div>

        <div class="card" style="margin-bottom:3px">

            <button id="lookupButton">
                CONNECT
            </button>

            <input id="lookupAddress" value="0x1C10e6574ee696f54b21A611a21313E4714628ad" placeholder="0x1C10e6574ee696f54b21A611a21313E4714628ad" style="margin-top:10px">

            <div class="tx-hash-group">
                <input id="txHashInput" type="text" autocomplete="off" spellcheck="false">
                <label id="txHashHelper" for="txHashInput">look into this transaction hash</label>
            </div>

            <p style="margin-top:8px">
                Status:
            </p>

            </div>

            <p style="margin-top:8px">
                Ledger:
            </p>

            <div id="address">
                -
            </div>

        </div>

        <div class="card" style="margin-bottom:3px">

            <h2>SOS Presence</h2>

            <!-- Effective accented in dark blue, matching index.html -->
            <p style="font-size:1.2rem; font-weight:700;">
                Effective:
                <span id="effective" style="color:var(--brand-blue-soft);">0</span>
            </p>

            <!-- Trust, Push, Total Supply — inline with · separators -->
            <p style="margin-top:8px">
                Trust: <span id="trust">0</span> ·
                Push: <span id="push">0</span> ·
                Total Supply: <span id="totalSupply">0</span>
            </p>

            <p style="margin-top:10px">
                <a id="etherscanLink" href="#" target="_blank" rel="noopener" style="color:var(--brand-blue-soft)">

        </div>
        <div class="card">

            <h2>Messages</h2>

            <p style="color:#9ca3af;font-size:14px;margin-bottom:8px">
                SignatureRecorded events intended to this address.
            </p>

            <div id="history">
                No data yet. Enter an address above.
            </div>

            <div id="historyFooter"></div>

        </div>

    </div>

    <script type="module">
        import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js";
        window.ethers = ethers;
    </script>

    <script>
        // ===============================
        // 69069 Messages page
        // Balances: trustCountOf / pushCountOf / totalSupply
        // Messages: SignatureRecorded (intendedTo) with non-empty metadata only
        // ===============================

        const SOS_CONTRACT = "0x7373DBC24Dcd785896E8Ac3d5372c6ced9B75a8A";
        const MAX_TX_SHOW = 10;
        const CREATOR_ADDRESS = "0x1C10e6574ee696f54b21A611a21313E4714628ad";

        // Same RPC order that works in the monitor
        const RPC_LIST = [
            "https://eth.drpc.org",
            "https://rpc.mevblocker.io",
            "https://ethereum-rpc.publicnode.com",
            "https://eth.llamarpc.com",
            "https://rpc.flashbots.net",
            "https://cloudflare-eth.com"
        ];

        const SOS_ABI = [
            {
                "inputs": [{ "internalType": "address", "name": "user", "type": "address" }],
                "name": "trustCountOf",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "user", "type": "address" }],
                "name": "pushCountOf",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "user", "type": "address" }],
                "name": "effectiveOf",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "totalSupply",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            "event SignatureRecorded(address indexed signer, address indexed intendedTo, bytes32 payloadHash, bytes signature, address indexed submitter, uint256 timestamp, string metadata)"
        ];

        // Same values as the working monitor
        const CHUNK = 2000;
        const LOOKBACK = 5000;
        const POLL_MS = 12000;

        let provider = null;
        let contract = null;
        let connectedAddress = null;
        let monitoringAddress = null;
        let listening = false;
        let pollTimer = null;
        let lastBlock = 0;
        const seenTx = new Set();

        function setStatus(msg) {
            document.getElementById("status").innerText = msg;
        }

        // ===== Transaction-hash scan-start field =====
        const txHashInput = document.getElementById("txHashInput");
        const txHashHelper = document.getElementById("txHashHelper");

        if (txHashInput && txHashHelper) {
            txHashInput.addEventListener("focus", function () {
                txHashHelper.classList.add("hidden");
            });
            txHashInput.addEventListener("blur", function () {
                if (!txHashInput.value.trim()) {
                    txHashHelper.classList.remove("hidden");
                }
            });
        }

        // Resolve a transaction hash to the block it was mined in,
        // so the message scan can start from that exact message.
        async function resolveScanStartBlock(txHash) {
            await ensureProvider();
            const tx = await provider.getTransaction(txHash);
            if (!tx) {
                throw new Error("Transaction hash not found");
            }
            if (tx.blockNumber === null || tx.blockNumber === undefined) {
                throw new Error("Transaction not yet mined");
            }
            return tx.blockNumber;
        }

        function short(addr) {
            if (!addr) return "—";
            return addr.slice(0, 6) + "…" + addr.slice(-4);
        }

        function shortErr(err) {
            if (!err) return "Unknown error";
            if (err.shortMessage) return err.shortMessage;
            if (err.info && err.info.error && err.info.error.message) return err.info.error.message;
            if (err.error && err.error.message) return err.error.message;
            if (err.reason) return err.reason;
            return err.message || String(err);
        }

        // Same robust connect as the working monitor
        async function connectProvider() {
            let lastError = null;
            for (const url of RPC_LIST) {
                try {
                    const p = new ethers.JsonRpcProvider(url, 1, { staticNetwork: true });
                    const n = await Promise.race([
                        p.getBlockNumber(),
                        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
                    ]);
                    if (typeof n === "number" && n > 0) {
                        console.log("Using RPC:", url, "block", n);
                        return p;
                    }
                } catch (e) {
                    console.warn("RPC failed:", url, shortErr(e));
                    lastError = e;
                }
            }
            throw lastError || new Error("All RPCs failed");
        }

        async function ensureProvider() {
            if (provider && contract) return;
            provider = await connectProvider();
            contract = new ethers.Contract(SOS_CONTRACT, SOS_ABI, provider);
        }

        async function loadBalances(address) {
            await ensureProvider();
            const trust = await contract.trustCountOf(address);
            const push = await contract.pushCountOf(address);
            const total = await contract.totalSupply();

            let effective;
            try {
                effective = await contract.effectiveOf(address);
            } catch (_) {
                effective = BigInt(trust) - BigInt(push);
            }

            document.getElementById("address").innerText = address;
            document.getElementById("effective").innerText = effective.toString();
            document.getElementById("trust").innerText = trust.toString();
            document.getElementById("push").innerText = push.toString();
            document.getElementById("totalSupply").innerText = total.toString();

            const link = document.getElementById("etherscanLink");
            link.href = "https://etherscan.io/token/" + SOS_CONTRACT + "?a=" + address;
            link.innerText = "Open on Etherscan →";
        }

        function formatTime(ts) {
            if (!ts) return "";
            try {
                return new Date(Number(ts) * 1000).toLocaleString();
            } catch (e) {
                return "";
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function etherscanEventsLink(address) {
            return "https://etherscan.io/advanced-filter?fadd=" + encodeURIComponent(address) +
                   "&tadd=" + encodeURIComponent(SOS_CONTRACT) +
                   "&txntype=0";
        }

        function hasMetadata(parsed) {
            const meta = (parsed.args.metadata || "").toString().trim();
            return meta.length > 0;
        }

        function renderEvent(parsed, log, isNew) {
            const key = (log.transactionHash || "") + "-" + (log.index !== undefined ? log.index : 0);
            if (seenTx.has(key)) return "";
            seenTx.add(key);

            const signer = parsed.args.signer || "";
            const ts = Number(parsed.args.timestamp || 0);
            const meta = (parsed.args.metadata || "").toString();
            const when = formatTime(ts);
            const blockNum = log.blockNumber || "?";
            const txHash = log.transactionHash || "";

            // Length like: tx0xffeb872021ed55956ac3a0c80d0c29837
            const txDisplay = "tx" + (txHash ? txHash.slice(0, 35) : "");

            const dirClass = "dir-in";
            const dirLabel = "← Received 1 SOS";

            let html =
                '<div class="event' + (isNew ? " new" : "") + '">' +
                '<div class="' + dirClass + '">' + dirLabel + '</div>';

            if (meta && meta.trim()) {
                html += '<div class="metadata-msg">' + escapeHtml(meta) + '</div>';
            }

            html +=
                '<div class="meta"><span class="sender">' + signer + '</span></div>' +
                '<div class="meta">· block ' + blockNum +
                (when ? ' · ' + when : '') + '</div>' +
                '<a href="https://etherscan.io/tx/' + txHash +
                '" target="_blank" rel="noopener">' + txDisplay + '</a>' +
                '</div>';

            return html;
        }

        // Exact same fetch pattern as the working monitor
        async function fetchChunk(fromBlock, toBlock, intendedTo) {
            const filter = contract.filters.SignatureRecorded(null, intendedTo);
            return await contract.queryFilter(filter, fromBlock, toBlock);
        }

        async function loadHistoryEvents(fromBlock, toBlock, intendedTo) {
            const all = [];
            for (let start = fromBlock; start <= toBlock; start += CHUNK) {
                const end = Math.min(start + CHUNK - 1, toBlock);
                setStatus("Loading history blocks " + start + " → " + end + "…");
                try {
                    const batch = await fetchChunk(start, end, intendedTo);
                    all.push(...batch);
                } catch (e) {
                    console.warn("Chunk failed, retrying smaller:", shortErr(e));
                    const mid = Math.floor((start + end) / 2);
                    if (mid > start) {
                        try {
                            all.push(...await fetchChunk(start, mid, intendedTo));
                            all.push(...await fetchChunk(mid + 1, end, intendedTo));
                        } catch (e2) {
                            console.warn("Sub-chunk still failed:", shortErr(e2));
                        }
                    }
                }
            }
            return all;
        }

        function setHistoryFooter(count, address) {
            const footer = document.getElementById("historyFooter");
            if (!footer) return;
            if (count > 0) {
                footer.innerHTML =
                    'Showing last ' + count +
                    " event" + (count === 1 ? "" : "s") +
                    '. <a href="' + etherscanEventsLink(address) +
                    '" target="_blank" rel="noopener">Full list on Etherscan →</a>';
            } else {
                footer.innerHTML =
                    '<a href="' + etherscanEventsLink(address) +
                    '" target="_blank" rel="noopener">Open filtered events on Etherscan →</a>';
            }
        }

        async function loadHistory(address, fromBlockOverride) {
            const historyDiv = document.getElementById("history");
            historyDiv.innerHTML = '<div class="loading">Loading signature events…</div>';
            document.getElementById("historyFooter").innerHTML = "";
            seenTx.clear();

            try {
                await ensureProvider();
                setStatus("Loading signature events…");

                const current = await provider.getBlockNumber();
                lastBlock = current;

                let events;
                if (typeof fromBlockOverride === "number") {
                    const fromBlock = Math.max(0, fromBlockOverride);
                    events = await loadHistoryEvents(fromBlock, current, address);
                    events = events.filter(ev => hasMetadata(ev));
                } else {
                    // Keep widening the scan window (doubling each pass) until we
                    // collect at least MAX_TX_SHOW metadata events, or we've
                    // scanned back to genesis / hit a safety cap.
                    const MAX_LOOKBACK = LOOKBACK * 20;
                    const collected = [];
                    const seenKeys = new Set();
                    let windowEnd = current;
                    let windowSize = LOOKBACK;
                    let windowStart = Math.max(0, current - windowSize);

                    while (true) {
                        const batch = await loadHistoryEvents(windowStart, windowEnd, address);
                        for (const ev of batch) {
                            const k = (ev.transactionHash || "") + "-" + (ev.index !== undefined ? ev.index : 0);
                            if (!seenKeys.has(k) && hasMetadata(ev)) {
                                seenKeys.add(k);
                                collected.push(ev);
                            }
                        }

                        if (collected.length >= MAX_TX_SHOW) break;
                        if (windowStart <= 0) break;
                        if (current - windowStart >= MAX_LOOKBACK) break;

                        windowEnd = windowStart - 1;
                        windowSize *= 2;
                        windowStart = Math.max(0, windowEnd - windowSize + 1);
                    }

                    events = collected;
                }

                // Newest first
                events.sort((a, b) => {
                    const ta = Number(a.args.timestamp || 0);
                    const tb = Number(b.args.timestamp || 0);
                    return tb - ta || (b.blockNumber - a.blockNumber);
                });

                const shown = events.slice(0, MAX_TX_SHOW);

                if (shown.length === 0) {
                    const rangeMsg = (typeof fromBlockOverride === "number")
                        ? "No SignatureRecorded events with metadata intended to this address from that transaction onward."
                        : "No SignatureRecorded events with metadata intended to this address in the last \\~5 000 blocks.";
                    historyDiv.innerHTML = '<div class="event">' + rangeMsg + '</div>';
                    setHistoryFooter(0, address);
                    return;
                }

                let html = "";
                for (const ev of shown) {
                    html += renderEvent(ev, ev.log || ev, false);
                }

                historyDiv.innerHTML = html;
                setHistoryFooter(shown.length, address);
            } catch (err) {
                console.error(err);
                historyDiv.innerHTML =
                    '<div class="event error">Could not load history: ' + escapeHtml(shortErr(err)) + "</div>";
                setHistoryFooter(0, address);
            }
        }

        async function pollNew() {
            if (!listening || !monitoringAddress || !provider || !contract) return;
            try {
                const current = await provider.getBlockNumber();
                if (current <= lastBlock) return;

                let events = await fetchChunk(lastBlock + 1, current, monitoringAddress);

                // Only events with metadata
                events = events.filter(ev => hasMetadata(ev));

                if (events.length > 0) {
                    events.sort((a, b) => {
                        const ta = Number(a.args.timestamp || 0);
                        const tb = Number(b.args.timestamp || 0);
                        return tb - ta || (b.blockNumber - a.blockNumber);
                    });

                    const historyDiv = document.getElementById("history");
                    if (historyDiv.querySelector(".loading") ||
                        (historyDiv.children.length <= 2 && historyDiv.textContent.includes("No "))) {
                        historyDiv.innerHTML = "";
                    }

                    let newHtml = "";
                    let added = 0;
                    for (const ev of events) {
                        const piece = renderEvent(ev, ev.log || ev, true);
                        if (piece) {
                            newHtml += piece;
                            added++;
                        }
                    }
                    if (newHtml) {
                        historyDiv.insertAdjacentHTML("afterbegin", newHtml);
                        const allEvents = historyDiv.querySelectorAll(".event");
                        if (allEvents.length > MAX_TX_SHOW) {
                            for (let i = MAX_TX_SHOW; i < allEvents.length; i++) {
                                allEvents[i].remove();
                            }
                        }
                        const visible = historyDiv.querySelectorAll(".event").length;
                        setHistoryFooter(visible, monitoringAddress);
                    }
                    setStatus("Live — new message at " + new Date().toLocaleTimeString() + " (block " + current + ")");
                } else {
                    setStatus("Live " + short(monitoringAddress) + " · block " + current);
                }
                lastBlock = current;
            } catch (e) {
                console.warn("Poll error:", shortErr(e));
                setStatus("Poll error (will retry): " + shortErr(e));
            }
        }

        function stopMonitoring() {
            listening = false;
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        async function startMonitoring(address) {
            stopMonitoring();
            monitoringAddress = address;
            listening = true;

            try {
                await ensureProvider();
                const current = await provider.getBlockNumber();
                lastBlock = current;
                setStatus("Live " + short(address) + " · waiting for new messages…");
                pollTimer = setInterval(pollNew, POLL_MS);
            } catch (err) {
                console.error(err);
                setStatus("Could not start live monitoring: " + shortErr(err));
                listening = false;
            }
        }

        async function lookup(rawAddress) {
            try {
                if (!window.ethers) {
                    throw new Error("ethers.js not loaded yet — wait a second and try again");
                }

                const address = ethers.getAddress(rawAddress.trim());

                document.getElementById("address").innerText = address;
                document.getElementById("lookupAddress").value = address;

                setStatus("Connecting to Ethereum…");
                await ensureProvider();

                setStatus("Loading balances…");
                await loadBalances(address);

                let fromBlockOverride;
                const txHashRaw = txHashInput ? txHashInput.value.trim() : "";
                if (txHashRaw) {
                    if (!/^0x[a-fA-F0-9]{64}$/.test(txHashRaw)) {
                        throw new Error("Invalid transaction hash — expected 0x + 64 hex chars");
                    }
                    setStatus("Resolving transaction hash…");
                    fromBlockOverride = await resolveScanStartBlock(txHashRaw);
                }

                await loadHistory(address, fromBlockOverride);

                await startMonitoring(address);

                setStatus("Connected · Live " + short(address));

                const url = new URL(window.location.href);
                url.searchParams.set("address", address);
                window.history.replaceState({}, "", url);

            } catch (err) {
                console.error(err);
                stopMonitoring();
                setStatus(shortErr(err));
            }
        }

        // ===== CONNECT BUTTON =====
        document.getElementById("lookupButton").onclick = async function() {
            try {
                if (window.ethereum) {
                    setStatus("Connecting…");
                    const accounts = await window.ethereum.request({
                        method: "eth_requestAccounts"
                    });
                    if (!accounts || !accounts[0]) {
                        throw new Error("No account returned");
                    }
                    connectedAddress = accounts[0];
                    document.getElementById("lookupAddress").value = connectedAddress;
                    document.getElementById("address").innerText = connectedAddress;
                    await lookup(connectedAddress);
                    return;
                }

                const raw = document.getElementById("lookupAddress").value.trim();
                if (!raw || !/^0x[a-fA-F0-9]{40}$/i.test(raw)) {
                    setStatus("No ledger found. Install MetaMask or enter a valid 0x address.");
                    return;
                }
                setStatus("Starting read-only monitoring…");
                await lookup(raw);

            } catch (err) {
                console.error(err);
                setStatus(err.message || String(err));
            }
        };

        // ===== AUTO ON LOAD =====
        window.addEventListener("load", async function() {
            const params = new URLSearchParams(window.location.search);
            const a = params.get("address");

            if (a) {
                document.getElementById("lookupAddress").value = a;
                setTimeout(function() { lookup(a); }, 400);
                return;
            }

            try {
                if (window.ethereum) {
                    const accounts = await window.ethereum.request({
                        method: "eth_accounts"
                    });
                    if (accounts && accounts[0]) {
                        connectedAddress = accounts[0];
                        document.getElementById("lookupAddress").value = connectedAddress;
                        document.getElementById("address").innerText = connectedAddress;
                        setTimeout(function() { lookup(connectedAddress); }, 400);
                        return;
                    }
                }
            } catch (err) {
                console.warn("Auto-connect failed:", err);
            }

            setTimeout(function() { lookup(CREATOR_ADDRESS); }, 400);
        });
    </script>
